<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Log In | Mini GitHub</title>

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/header.css"/>
    <link rel="stylesheet" href="../styles/footer.css"/>
    <link rel="stylesheet" href="../styles/components.css"/>
    <link rel="stylesheet" href="../styles/register.css"/>
    <link rel="stylesheet" href="../styles/admin.css"/>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="Mini GitHub Logo"/>
        <h2>Mini GitHub</h2>
      </div>
      <div class="navbar">
        <a href="../pages/home.html" class="primary-button">Home</a>
        <a href="../pages/about.html" class="primary-button">About</a>
        <a href="../pages/setting.html" class="primary-button">Settings</a>
      </div>
    </div>

    <div class="main auth">
      <div class="card form-card admin-login-card">
        <div class="admin-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <span class="admin-tag">Admin</span>
        <h2>Admin Portal</h2>
        <p class="form-sub">Restricted area. Authorized administrators only.</p>

        <form id="admin-login-form">
          <div class="form-group">
            <label for="email">Username or email</label>
           placeholder="Username or email"<input type="text" id="email" name="email" placeholder="Username or email" required/>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required/>
          </div>

          <label class="checkbox admin-show">
            <input type="checkbox" id="show-password"/> Show password
          </label>

          <button type="submit" class="primary-button form-button">Log In</button>
          <p id="message" class="form-message" role="status" hidden></p>
        </form>

        <p class="form-footer">
          Not an admin? <a href="../register/login_choice.html" class="form-link">Back to login options</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Mini GitHub. All rights reserved.</p>
    </div>
    <script src="../scripts/admin.js"></script>
  </body>
</html>
