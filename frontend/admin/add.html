<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up | Mini GitHub</title>

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/header.css"/>
    <link rel="stylesheet" href="../styles/footer.css"/>
    <link rel="stylesheet" href="../styles/admin.css"/>
    <link rel="stylesheet" href="../styles/components.css"/>
  </head>
  <body>

    <div class="main admin">
      <div class="card form-card">
        <h2>Users</h2>

      </div>
      <div class="card form-card">
        <h2>Admins</h2>

      </div>
    </div>
    <center>
    <div class="card form-admin">
    <form id="signup-form" data-redirect="login.html">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username"
                   minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]+"
                   title="Letters, numbers, - and _ only" required/>
          
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password"
                   minlength="8" 
                   title="At least 8 characters" required/>
          
          </div>
          <label class="checkbox">
            <input type="checkbox" name="assignAdmin"> Admin
          </label>
          <button type="submit" class="primary-button form-button">Add</button>
    </form>
    </div>
    </center>
  </body>
</html>
