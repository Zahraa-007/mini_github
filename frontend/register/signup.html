<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up | Mini GitHub</title>

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/header.css"/>
    <link rel="stylesheet" href="../styles/footer.css"/>
    <link rel="stylesheet" href="../styles/components.css"/>
    <link rel="stylesheet" href="../styles/register.css"/>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="Mini GitHub Logo"/>
        <h2>Mini GitHub</h2>
      </div>
      <div class="navbar">
        <a href="../pages/home.html" class="primary-button">Home</a>
        <a href="../pages/about.html" class="primary-button">About</a>
        <a href="../pages/setting.html" class="primary-button">Settings</a>
      </div>
    </div>

    <div class="main auth">
      <div class="card form-card">
        <h2>Create your account</h2>
        <p class="form-sub">Start building and sharing your projects</p>

        <form id="signup-form" data-redirect="login.html">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username"
                   minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]+"
                   title="Letters, numbers, - and _ only" required/>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required/>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password"
                   minlength="8" 
                   title="At least 8 characters" required/>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm-password"
                   placeholder="Confirm password" required/>
          </div>

          <label class="checkbox">
            <input type="checkbox" name="terms" required/> I agree to the terms of use
          </label>

          <button type="submit" class="primary-button form-button">Sign Up</button>
        </form>
        <p id="message"></p>
        <p class="form-footer">
          Already have an account? <a href="login.html" class="form-link">Log in</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Mini GitHub. All rights reserved.</p>
    </div>
    <script src="../scripts/auth.js"></script>
  </body>
</html>
