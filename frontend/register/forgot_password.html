<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password | Mini GitHub</title>

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/header.css"/>
    <link rel="stylesheet" href="../styles/footer.css"/>
    <link rel="stylesheet" href="../styles/components.css"/>
    <link rel="stylesheet" href="../styles/register.css"/>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="Mini GitHub Logo"/>
        <h2>Mini GitHub</h2>
      </div>
      <div class="navbar">
        <a href="../pages/home.html" class="primary-button">Home</a>
        <a href="../pages/about.html" class="primary-button">About</a>
        <a href="../pages/setting.html" class="primary-button">Settings</a>
      </div>
    </div>

    <div class="main auth">
      <div class="card form-card">
        <h2>Forgot your password?</h2>
        <p class="form-sub">Please enter your registered email address, and we'll send you a link to reset your password.</p>

        <form id="forgot-form" data-message="a reset link has been sent.">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required/>
          </div>

          <button type="submit" class="primary-button form-button">Send code</button>
          <p class="form-message" role="status" hidden></p>
        </form>

        <p class="form-footer">
          <a href="login.html" class="form-link">Back to log in</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Mini GitHub. All rights reserved.</p>
    </div>
  </body>
</html>
