<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log In | Mini GitHub</title>

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/header.css"/>
    <link rel="stylesheet" href="../styles/footer.css"/>
    <link rel="stylesheet" href="../styles/components.css"/>
    <link rel="stylesheet" href="../styles/register.css"/>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="Mini GitHub Logo"/>
        <h2>Mini GitHub</h2>
      </div>
      <div class="navbar">
        <a href="../pages/home.html" class="primary-button">Home</a>
        <a href="../pages/about.html" class="primary-button">About</a>
        <a href="../pages/setting.html" class="primary-button">Settings</a>
      </div>
    </div>

    <div class="main auth">
      <div class="card form-card">
        <h2>Log In</h2>
        <p class="form-sub">Welcome back! Log in to see your repositories</p>

        <form id="login-form" data-redirect="../pages/profile.html">
          <div class="form-group">
            <label for="username">Username or email</label>
            <input type="text" id="username" name="username" placeholder="Username or email" required/>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required/>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" name="remember"/> Remember me
            </label>
            <a href="forgot_password.html" class="form-link">Forgot password?</a>
          </div>

          <button type="submit" class="primary-button form-button">Log In</button>
        </form>

        <p class="form-footer">
          New to Mini GitHub? <a href="signup.html" class="form-link">Create an account</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Mini GitHub. All rights reserved.</p>
    </div>
  </body>
</html>
